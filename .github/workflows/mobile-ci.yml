name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Legacy warnings stay visible; analyzer errors and failing tests block releases.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby -c fastlane/Fastfile
