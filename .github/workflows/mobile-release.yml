name: Mobile release
run-name: Mobile ${{ inputs.platform }} ${{ inputs.version }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [both, android, ios]
        default: both
      version:
        description: Marketing version (for example 1.0.1)
        type: string
        required: true
      build_number:
        description: Unused positive build number, higher than previous store uploads
        type: string
        required: true
      upload:
        description: Upload to Play internal testing / TestFlight
        type: boolean
        default: false

permissions:
  contents: read

# Serialize releases so two uploads cannot race. Running uploads are never cancelled.
concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
  CI: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"
  FASTLANE_OPT_OUT_USAGE: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python3 ci/prepare_release.py validate

  checks:
    needs: validate
    uses: ./.github/workflows/mobile-ci.yml

  android:
    needs: checks
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Prepare Android signing and Firebase
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 ci/prepare_release.py android
      - name: Build signed Android bundle
        run: flutter build appbundle --release --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
      - uses: ruby/setup-ruby@v1
        if: inputs.upload
        with:
          ruby-version: "3.3"
      - name: Install upload tooling
        if: inputs.upload
        run: bundle install
      - name: Upload to Play internal testing
        if: inputs.upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android internal
      - name: Remove temporary signing files
        if: always()
        run: python3 ci/prepare_release.py cleanup-android

  ios:
    needs: checks
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 90
    environment: mobile-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bundle install
      - run: flutter pub get --enforce-lockfile
      - name: Prepare iOS Firebase
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: python3 ci/prepare_release.py ios
      - name: Build signed iOS archive and IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane ios build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 30
      - name: Save resolved dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dependency-locks-${{ inputs.build_number }}
          path: |
            ios/Podfile.lock
            Gemfile.lock
          retention-days: 30
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: bundle exec fastlane ios beta
      - name: Remove temporary Apple signing files
        if: always()
        run: bundle exec fastlane ios cleanup
