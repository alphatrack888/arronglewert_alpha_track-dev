# Machine-specific JDK: copy gradle-local.properties.example → gradle-local.properties
# Release builds run lintVital on every plugin; 384m Metaspace fails (e.g. connectivity_plus).
# Heap: 3G balances 16GB laptops vs legacy CI (4G). Override in gradle-local.properties if needed.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
